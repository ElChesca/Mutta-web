name: mutta_web
description: Landing web de MUTTA Sunset en Boxes Potrero de los Funes.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.1
  json_annotation: ^4.12.0
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  json_serializable: ^6.15.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/event.json
    - assets/images/
    - assets/brand/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
